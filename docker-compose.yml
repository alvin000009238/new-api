# New-API Docker Compose Configuration
#
# Production with Cloudflare Tunnel:
#   1. cp .env.prod.example .env
#   2. Edit .env and set POSTGRES_PASSWORD, SESSION_SECRET, and CLOUDFLARE_TUNNEL_TOKEN.
#   3. docker compose up -d --build
#
# The application is not published with a host port. Cloudflare Tunnel should
# route the public hostname to http://new-api:3000 inside this compose network.
services:
  new-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: new-api:local-prod
    pull_policy: build
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    expose:
      - '3000'
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      SQL_DSN: "postgresql://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-new-api}"
      REDIS_CONN_STRING: "redis://redis:6379/0"
      SESSION_SECRET: "${SESSION_SECRET:?SESSION_SECRET is required}"
      TZ: "${TZ:-Asia/Taipei}"
      ERROR_LOG_ENABLED: "true"
      BATCH_UPDATE_ENABLED: "true"
      NODE_NAME: "${NODE_NAME:-new-api-node-1}"
    depends_on:
      - redis
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-root}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: "${POSTGRES_DB:-new-api}"
    volumes:
      - pg_data:/var/lib/postgresql/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: always
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - "${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}"
    depends_on:
      - new-api

volumes:
  pg_data:
  redis_data:
