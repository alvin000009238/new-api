# Production compose file for running the image built from this repository.
#
# Usage:
#   1. cp .env.prod.example .env
#   2. Edit .env and set strong secrets.
#   3. docker compose -f docker-compose.prod.yml up -d --build
#
# Rebuild after pulling updates:
#   docker compose -f docker-compose.prod.yml up -d --build new-api

services:
  new-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: new-api:local-prod
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "${NEW_API_PORT:-3000}:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      SQL_DSN: "postgresql://newapi:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/new-api"
      REDIS_CONN_STRING: "redis://redis:6379/0"
      SESSION_SECRET: "${SESSION_SECRET:?SESSION_SECRET is required}"
      TZ: "${TZ:-Asia/Taipei}"
      ERROR_LOG_ENABLED: "true"
      BATCH_UPDATE_ENABLED: "true"
      NODE_NAME: "${NODE_NAME:-new-api-prod-1}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: new-api-redis
    restart: always
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:15-alpine
    container_name: new-api-postgres
    restart: always
    environment:
      POSTGRES_USER: newapi
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: new-api
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newapi -d new-api"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  redis_data:
